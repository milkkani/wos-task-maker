
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOS 集結スクショOCR</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px 14px 70px;
  background:#0c0d10;
  color:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
main{max-width:720px;margin:auto}
h1{font-size:25px}
h2{font-size:19px;margin:0 0 14px}
p{line-height:1.6}
.panel{
  background:#191c22;
  border:1px solid #343842;
  border-radius:16px;
  padding:17px;
  margin:16px 0;
}
.muted{color:#bdc2cc;font-size:13px}
.warning{color:#f2ca63;font-size:13px}
button,input,select{font:inherit}
button{
  border:0;
  border-radius:10px;
  background:#4d91e8;
  color:white;
  padding:13px;
  font-weight:800;
  min-height:45px;
}
button:disabled{opacity:.45}
.secondary{background:#303844}
.full{width:100%}
input[type=file]{width:100%}
input[type=text],
input[type=datetime-local],
select{
  background:#111317;
  color:#fff;
  border:1px solid #4b505c;
  border-radius:8px;
  padding:11px;
  width:100%;
  min-width:0;
}
input:focus,select:focus{
  outline:2px solid #4d91e8;
}
.preview-wrap{
  position:relative;
  margin-top:14px;
  touch-action:none;
  user-select:none;
  overflow:hidden;
  border-radius:10px;
}
.preview-wrap img{
  display:block;
  width:100%;
  height:auto;
}
.preview-wrap[hidden]{display:none}
.selection{
  position:absolute;
  border:2px solid #f2ca63;
  background:rgba(242,202,99,.15);
  pointer-events:none;
  display:none;
}
.row{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
}
.row>*{flex:1}
.status{
  margin:12px 0;
  color:#91c4ff;
}
progress{width:100%;height:12px}
.result{
  background:#111317;
  border:1px solid #343842;
  border-radius:12px;
  padding:13px;
  margin:12px 0;
}
.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.result-grid label{
  font-size:13px;
  color:#bdc2cc;
}
.result-grid label input,
.result-grid label select{
  margin-top:6px;
}
.result strong{
  color:#91c4ff;
  font-size:22px;
}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#111317;
  padding:12px;
  border-radius:10px;
  font-size:12px;
}
.crop-image{
  width:100%;
  max-height:260px;
  object-fit:contain;
  background:#08090b;
  border-radius:9px;
  margin-top:10px;
}
.crop-image[hidden]{display:none}
.mode-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0;
}
.mode-options button{background:#303844}
.mode-options button.active{background:#4d91e8}
</style>
</head>

<body>
<main>
<h1>📸 WOS 集結スクショ認識</h1>
<p class="muted">
スクショから複数の集結時間を無料OCRで読み取ります。
画像はブラウザ内で処理します。
</p>

<section class="panel">
<h2>① スクショを選択</h2>
<input id="photo" type="file" accept="image/*">
<p id="captureStatus" class="muted">撮影時刻：未取得</p>
<label class="muted" for="captureTime">
撮影時刻（必要なら修正）
</label>
<input id="captureTime" type="datetime-local" step="1">
<p class="warning">
ファイルの最終更新日時を仮の撮影時刻として使用します。
実際の撮影時刻と異なる場合は修正してください。
</p>
</section>

<section class="panel">
<h2>② 読み取り方法</h2>

<div class="mode-options">
<button id="autoMode" class="active" type="button">
✨ 自動認識
</button>
<button id="manualMode" type="button">
✋ 範囲指定
</button>
</div>

<p id="modeHelp" class="muted">
集結一覧の右上に表示される時間を自動で読み取ります。
</p>

<div id="previewWrap" class="preview-wrap" hidden>
<img id="preview" alt="選択したスクショ">
<div id="selection" class="selection"></div>
</div>

<button
  id="clearCrop"
  class="secondary full"
  type="button"
  style="margin-top:12px"
  hidden
>
範囲指定を解除
</button>

<button
  id="recognize"
  class="full"
  type="button"
  style="margin-top:12px"
  disabled
>
画像認識を開始
</button>

<img id="cropPreview" class="crop-image"
     hidden alt="OCR対象範囲">

<p id="status" class="status">
スクショを選択してください。
</p>

<progress id="progress" max="100" value="0"></progress>
</section>

<section class="panel">
<h2>③ 認識した集結時間</h2>
<div id="results">まだ認識していません。</div>

<button
  id="addManual"
  class="secondary full"
  type="button"
>
＋ 時間を手動追加
</button>

<p class="warning">
認識した数字と、集結中・行軍中の状態を
必ず確認してください。
</p>
</section>

<section class="panel">
<h2>④ OCRが読み取った全文</h2>
<pre id="raw">未実行</pre>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
"use strict";

const $ = id => document.getElementById(id);

const photo = $("photo");
const preview = $("preview");
const wrap = $("previewWrap");
const selection = $("selection");
const captureTime = $("captureTime");
const results = $("results");
const recognize = $("recognize");
const status = $("status");
const progress = $("progress");

let file = null;
let previewURL = null;
let worker = null;
let crop = null;
let dragStart = null;
let rows = [];
let busy = false;
let mode = "auto";

const pad = n => String(n).padStart(2,"0");

function localDateValue(date) {
  return date.getFullYear() + "-" +
    pad(date.getMonth()+1) + "-" +
    pad(date.getDate()) + "T" +
    pad(date.getHours()) + ":" +
    pad(date.getMinutes()) + ":" +
    pad(date.getSeconds());
}

function captureMs() {
  return captureTime.value
    ? new Date(captureTime.value).getTime()
    : NaN;
}

function parseCountdown(value) {
  const parts = value.trim().split(":");

  if (
    parts.length < 2 ||
    parts.length > 3 ||
    !parts.every(p => /^\d{1,2}$/.test(p))
  ) {
    return NaN;
  }

  const nums = parts.map(Number);

  if (nums.some((n,i) => i > 0 && n > 59)) {
    return NaN;
  }

  return parts.length === 2
    ? nums[0]*60 + nums[1]
    : nums[0]*3600 + nums[1]*60 + nums[2];
}

function formatRemaining(seconds) {
  if (!Number.isFinite(seconds)) {
    return "入力を確認";
  }

  if (seconds <= 0) {
    return "終了（推定）";
  }

  const n = Math.ceil(seconds);

  return pad(Math.floor(n/3600)) + ":" +
    pad(Math.floor(n%3600/60)) + ":" +
    pad(n%60);
}

function extractTimes(text) {
  const normalized = text
    .replace(/[０-９]/g, c =>
      String.fromCharCode(c.charCodeAt(0)-65248)
    )
    .replace(/[：﹕]/g, ":");

  const matches = [
    ...normalized.matchAll(
      /(?:^|[^\d:])((?:\d{1,2}:)?[0-5]\d:[0-5]\d)(?![\d:])/gm
    )
  ];

  return matches.map(m => m[1]);
}

function updateClocks() {
  const base = captureMs();

  rows.forEach(row => {
    if (!row.element) return;

    const value = row.element
      .querySelector(".countdown-input").value;

    const seconds = parseCountdown(value);
    const output = row.element
      .querySelector(".remaining-output");

    if (!Number.isFinite(base)) {
      output.textContent =
        "撮影時刻を入力してください";
    } else if (!Number.isFinite(seconds)) {
      output.textContent =
        "時間を確認してください";
    } else {
      output.textContent = formatRemaining(
        (base + seconds*1000 - Date.now())/1000
      );
    }
  });
}

function renderRows() {
  results.replaceChildren();

  if (!rows.length) {
    results.textContent =
      "時間を検出できませんでした。手動追加もできます。";
    return;
  }

  rows.forEach((row,index) => {
    const box = document.createElement("div");
    box.className = "result";

    const heading = document.createElement("p");
    heading.textContent = "検出 " + (index+1);
    heading.className = "muted";

    const grid = document.createElement("div");
    grid.className = "result-grid";

    const timeLabel = document.createElement("label");
    timeLabel.textContent = "スクショ内の残り時間";

    const input = document.createElement("input");
    input.type = "text";
    input.className = "countdown-input";
    input.inputMode = "numeric";
    input.placeholder = "00:02:44";
    input.value = row.time;

    input.addEventListener("input", () => {
      row.time = input.value;
      updateClocks();
    });

    timeLabel.append(input);

    const stateLabel = document.createElement("label");
    stateLabel.textContent = "状態";

    const state = document.createElement("select");

    [
      ["unknown","要確認"],
      ["gathering","集結中"],
      ["marching","行軍中"]
    ].forEach(([value,label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      state.append(option);
    });

    state.value = row.state;
    state.addEventListener("change", () => {
      row.state = state.value;
    });

    stateLabel.append(state);
    grid.append(timeLabel,stateLabel);

    const label = document.createElement("p");
    label.className = "muted";
    label.textContent =
      "現在の残り時間（撮影時刻から推定）";

    const output = document.createElement("strong");
    output.className = "remaining-output";

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "secondary full";
    remove.textContent = "この行を削除";
    remove.style.marginTop = "12px";

    remove.addEventListener("click", () => {
      rows = rows.filter(r => r !== row);
      renderRows();
    });

    box.append(
      heading,grid,label,output,remove
    );

    row.element = box;
    results.append(box);
  });

  updateClocks();
}

function setMode(next) {
  mode = next;

  $("autoMode").classList.toggle(
    "active", mode === "auto"
  );

  $("manualMode").classList.toggle(
    "active", mode === "manual"
  );

  $("clearCrop").hidden = mode !== "manual";

  $("modeHelp").textContent =
    mode === "auto"
      ? "集結カード右上の時間表示部分を自動認識します。失敗した場合は範囲指定を使ってください。"
      : "スクショ上で集結時間が表示される範囲を指で囲ってください。";

  crop = null;
  selection.style.display = "none";
}

$("autoMode").addEventListener(
  "click", () => setMode("auto")
);

$("manualMode").addEventListener(
  "click", () => setMode("manual")
);

function pointFromEvent(event) {
  const rect = wrap.getBoundingClientRect();

  return {
    x: Math.max(
      0,
      Math.min(
        rect.width,
        event.clientX-rect.left
      )
    ),
    y: Math.max(
      0,
      Math.min(
        rect.height,
        event.clientY-rect.top
      )
    )
  };
}

function drawSelection(a,b) {
  Object.assign(selection.style, {
    display:"block",
    left:Math.min(a.x,b.x)+"px",
    top:Math.min(a.y,b.y)+"px",
    width:Math.abs(a.x-b.x)+"px",
    height:Math.abs(a.y-b.y)+"px"
  });
}

wrap.addEventListener("pointerdown", event => {
  if (mode !== "manual" || !file || busy) {
    return;
  }

  event.preventDefault();

  dragStart = pointFromEvent(event);

  wrap.setPointerCapture(event.pointerId);
  drawSelection(dragStart,dragStart);
});

wrap.addEventListener("pointermove", event => {
  if (dragStart) {
    drawSelection(
      dragStart,
      pointFromEvent(event)
    );
  }
});

wrap.addEventListener("pointerup", event => {
  if (!dragStart) return;

  const end = pointFromEvent(event);
  const rect = wrap.getBoundingClientRect();

  const x = Math.min(dragStart.x,end.x);
  const y = Math.min(dragStart.y,end.y);
  const w = Math.abs(dragStart.x-end.x);
  const h = Math.abs(dragStart.y-end.y);

  crop = w >= 8 && h >= 8
    ? {
        x:x/rect.width,
        y:y/rect.height,
        w:w/rect.width,
        h:h/rect.height
      }
    : null;

  if (!crop) {
    selection.style.display = "none";
  }

  dragStart = null;
});

wrap.addEventListener("pointercancel", () => {
  dragStart = null;
});

$("clearCrop").addEventListener("click", () => {
  crop = null;
  selection.style.display = "none";
});

photo.addEventListener("change", () => {
  if (busy) return;

  file = photo.files?.[0] || null;

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
  }

  previewURL = null;
  rows = [];

  renderRows();

  $("raw").textContent = "未実行";
  $("cropPreview").hidden = true;
  progress.value = 0;

  if (!file) {
    wrap.hidden = true;
    recognize.disabled = true;

    $("captureStatus").textContent =
      "撮影時刻：未取得";

    status.textContent =
      "スクショを選択してください。";

    return;
  }

  previewURL = URL.createObjectURL(file);
  preview.src = previewURL;

  wrap.hidden = false;
  crop = null;
  selection.style.display = "none";
  recognize.disabled = false;

  const valid = file.lastModified > 0;

  captureTime.value = valid
    ? localDateValue(
        new Date(file.lastModified)
      )
    : "";

  $("captureStatus").textContent = valid
    ? "ファイル最終更新日時を仮入力しました。撮影時刻と一致するか確認してください。"
    : "撮影時刻を取得できません。手入力してください。";

  status.textContent =
    "画像を選択しました。";
});

captureTime.addEventListener(
  "input", updateClocks
);

function loadImage(blob) {
  return new Promise((resolve,reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(
        new Error("画像を開けませんでした")
      );
    };

    img.src = url;
  });
}

async function prepareImage(blob,region) {
  const img = await loadImage(blob);

  const sx = Math.floor(
    region.x * img.naturalWidth
  );

  const sy = Math.floor(
    region.y * img.naturalHeight
  );

  const sw = Math.max(
    1,
    Math.floor(
      region.w * img.naturalWidth
    )
  );

  const sh = Math.max(
    1,
    Math.floor(
      region.h * img.naturalHeight
    )
  );

  const scale = Math.min(
    3,
    2400/sw,
    3200/sh
  );

  const canvas =
    document.createElement("canvas");

  canvas.width = Math.max(
    1,Math.round(sw*scale)
  );

  canvas.height = Math.max(
    1,Math.round(sh*scale)
  );

  const ctx = canvas.getContext(
    "2d",
    {willReadFrequently:true}
  );

  ctx.drawImage(
    img,
    sx,sy,sw,sh,
    0,0,
    canvas.width,
    canvas.height
  );

  const data = ctx.getImageData(
    0,0,
    canvas.width,
    canvas.height
  );

  for (
    let i=0;
    i<data.data.length;
    i+=4
  ) {
    const gray =
      .299*data.data[i] +
      .587*data.data[i+1] +
      .114*data.data[i+2];

    const value = gray > 125
      ? 255
      : 0;

    data.data[i] = value;
    data.data[i+1] = value;
    data.data[i+2] = value;
  }

  ctx.putImageData(data,0,0);

  return canvas;
}

// 集結カードの右上を優先して認識
function getRegions() {
  if (mode === "manual") {
    return [
      crop || {x:0,y:0,w:1,h:1}
    ];
  }

  // 前回のホワサバスクショを基準にした仮の位置
  return [
    {x:0.55,y:0.17,w:0.35,h:0.08},
    {x:0.55,y:0.42,w:0.35,h:0.08},
    {x:0.55,y:0.67,w:0.35,h:0.08}
  ];
}

recognize.addEventListener(
  "click",
  async () => {
    if (!file || busy) return;

    busy = true;
    recognize.disabled = true;
    photo.disabled = true;
    progress.value = 0;

    status.textContent =
      "画像を準備しています...";

    try {
      if (!window.Tesseract) {
        throw new Error(
          "OCRライブラリの読み込みに失敗しました"
        );
      }

      if (!worker) {
        status.textContent =
          "OCRエンジンを読み込み中...";

        worker = await Tesseract.createWorker(
          "eng",
          1,
          {
            logger:message => {
              if (message.status) {
                status.textContent =
                  message.status;
              }

              if (
                typeof message.progress ===
                "number"
              ) {
                progress.value =
                  Math.round(
                    message.progress*100
                  );
              }
            }
          }
        );

        await worker.setParameters({
          tessedit_char_whitelist:
            "0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ",
          preserve_interword_spaces:"1"
        });
      }

      const regions = getRegions();
      const allTimes = [];
      const allTexts = [];
      const previews = [];

      for (
        let i=0;
        i<regions.length;
        i++
      ) {
        status.textContent =
          "領域 " +
          (i+1) + "/" +
          regions.length +
          " を認識中...";

        const canvas =
          await prepareImage(
            file,
            regions[i]
          );

        previews.push(
          canvas.toDataURL("image/png")
        );

        const result =
          await worker.recognize(canvas);

        const text =
          result.data.text || "";

        allTexts.push(
          "【領域 " + (i+1) + "】\n" +
          text
        );

        allTimes.push(
          ...extractTimes(text)
        );

        progress.value =
          Math.round(
            (i+1) /
            regions.length *
            100
          );
      }

      // HH:MM:SS のみ採用し、
      // 32:15 のような誤検出を除外
      const unique = [
        ...new Set(allTimes)
      ].filter(time => {
        const parts = time.split(":");

        if (parts.length !== 3) {
          return false;
        }

        const [
          hours,
          minutes,
          seconds
        ] = parts.map(Number);

        return (
          Number.isInteger(hours) &&
          Number.isInteger(minutes) &&
          Number.isInteger(seconds) &&
          hours >= 0 &&
          minutes >= 0 &&
          minutes <= 59 &&
          seconds >= 0 &&
          seconds <= 59
        );
      });

      rows = unique.map(time => ({
        time,
        state:"unknown",
        element:null
      }));

      renderRows();

      $("raw").textContent =
        allTexts.join("\n\n") ||
        "文字を認識できませんでした。";

      const cropPreview =
        $("cropPreview");

      cropPreview.src = previews[0];
      cropPreview.hidden = false;

      status.textContent =
        "認識完了：" +
        unique.length +
        "件の時間を検出";

      progress.value = 100;

    } catch (error) {
      status.textContent =
        "エラー：" + error.message;

    } finally {
      busy = false;
      recognize.disabled = !file;
      photo.disabled = false;
    }
  }
);

$("addManual").addEventListener(
  "click",
  () => {
    rows.push({
      time:"",
      state:"unknown",
      element:null
    });

    renderRows();
  }
);

setInterval(updateClocks,250);
</script>
</body>
</html>
